services:
  db:
    image: postgres:17
    container_name: maialab-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maialab
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maialab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
